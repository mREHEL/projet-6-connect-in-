version: "3.9"

services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: laravel
        working_dir: /app
        environment:
            - DB_HOST=db
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - TZ=Europe/Paris
        env_file: .env
        entrypoint: /entrypoint.sh
        volumes:
            - ./backend:/app
        ports:
            - "8000:8000"
        depends_on:
            - db
        restart: always

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: vue
        working_dir: /app
        volumes:
            - ./frontend:/app
            - /app/node_modules
            - /app/.vite
        ports:
            - "5173:5173"
        restart: always
        environment:
            - VITE_HOST=0.0.0.0

    db:
        image: mysql:8
        container_name: mysql
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            TZ: Europe/Paris
        env_file: .env
        volumes:
            - db_data:/var/lib/mysql
        ports:
            - "3306:3306"
        restart: always

    phpmyadmin:
        image: phpmyadmin
        container_name: phpmyadmin
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        ports:
            - "8080:80"
        depends_on:
            - db
        restart: always

volumes:
    db_data:
